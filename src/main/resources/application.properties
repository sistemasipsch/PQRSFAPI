# ============================================================================
# CONFIGURACIÓN DEL SISTEMA PQRSF SIAU - IPS CLINICAL HOUSE
# ============================================================================

# Variables de entorno locales (contraseña del correo, etc.): archivo backend/.env
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# Registro también en archivo (para diagnosticar envíos de correo, etc.)
logging.file.name=${LOG_FILE:logs/backend.log}
logging.charset.file=UTF-8
server.servlet.context-path=/

# ----------------------------------------------------------------------------
# BASE DE DATOS POSTGRESQL (Base de datos: pqrsf-siau, Puerto: 5432)
# ----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pqrsf-siau}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# Los errores nunca devuelven trazas ni detalles internos al navegador
server.error.include-stacktrace=never
server.error.include-message=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------------------------------
# CARGA DE ARCHIVOS (HASTA 3 ARCHIVOS, SOPORTE ROBUSTO MULTIPART)
# ----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
app.storage.upload-dir=${UPLOAD_DIR:uploads}

# ----------------------------------------------------------------------------
# SERVICIO DE CORREO ELECTRÓNICO (SMTP GMAIL)
#   - Remitente (constancia al ciudadano, respuestas, códigos): MAIL_USERNAME / MAIL_FROM
#   - Destino de las solicitudes nuevas (jefe SIAU):            MAIL_JEFE (siau@clinicalhouse.co)
# La contraseña DEBE ser una "contraseña de aplicación" de Google (16 letras, sin espacios):
#   https://myaccount.google.com/apppasswords  (iniciando sesión con la cuenta remitente)
# ----------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:notificacioneschpqrs@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000

# Destino de la notificación de solicitudes nuevas (Jefe SIAU)
app.mail.siau-chief-email=${MAIL_JEFE:siau@clinicalhouse.co}
# Remitente: Gmail exige que sea la misma cuenta de spring.mail.username
app.mail.from=${MAIL_FROM:notificacioneschpqrs@gmail.com}
app.mail.enabled=${MAIL_ENABLED:true}

# URL pública del frontend (logo en correos y enlace al panel)
app.public-url=${APP_PUBLIC_URL:http://localhost:5173}

# ----------------------------------------------------------------------------
# SEGURIDAD Y JWT
# ----------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ----------------------------------------------------------------------------
# CORS: dominios desde los que se abre el panel (en producción, el dominio real)
# ----------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
